name: ci

# Typecheck, lint, test, build. That is all this can prove from a pull request, and it is what the
# repository has been running by hand so far.
#
# It deliberately holds no credentials. The suite resolves the auth provider before every store and
# screen test, so `vite.config.ts`'s `test.env` block pins VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY
# empty — a green run here is the local development adapter, never a real project. Staging builds and
# automated tests must never point at Production, and nothing below reaches a network at all:
# no migration is applied, no RPC is called, no mail is sent.
#
# What CI does NOT cover, and no amount of green here changes that: the SQL has still never been
# parsed by Postgres. That validation is a staging run — see scripts/apply-migrations.mjs and
# supabase/probes/authorization_probes.sql.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One working-directory for every run step: the app lives in esme-cu-platform/, while checkout and
    # setup-node must stay at the repository root — `defaults.run` covers the run steps only, which is
    # exactly the split this needs.
    defaults:
      run:
        shell: bash
        working-directory: esme-cu-platform
    env:
      # Belt and braces beside the vite.config.ts pin: no provider is reachable from this run, so no
      # test can accidentally authenticate against a real project if the config ever stops pinning.
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: vitest 5.0.5 declares engines "^22.12.0 || ^24.0.0 || >=26.0.0" and vite 8.3.4
      # declares "^20.19.0 || >=22.12.0". A 20.x runner satisfies Vite at best and is outside Vitest's
      # supported range, so the test step would become the thing that fails.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: esme-cu-platform/package-lock.json

      # Versions are echoed here because a run that dies in its first seconds otherwise reports only
      # a bare exit code. --no-audit/--no-fund keep the install output to the part that matters.
      - name: Install (lockfile only)
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc -b --force

      # Warnings are reported and do not fail the run: the pre-existing react-hooks/react-compiler
      # notices are on record in PROJECT_MASTER_GUIDE.md §11. Errors fail, as they always have.
      - name: Lint
        run: npm run lint

      # ubuntu-latest is 2 vCPU. Vitest defaults its worker count to the core count it detects, and on
      # a shared runner that over-subscribes memory; --maxWorkers=2 pins it to the runner's real size.
      # (Vitest 5 has no --threads CLI flag any more; the pool is selected with --pool, default forks.)
      - name: Unit and integration tests
        run: npx vitest run --maxWorkers=2

      - name: Production build
        run: npm run build

      # A credential VALUE in the shipped bundle is a release blocker, not a review note. The bare
      # prefixes do appear as string literals in configurationProblems(), which is why this greps for
      # a prefix followed by a value.
      - name: Scan the bundle for credential values
        run: |
          if grep -rEo 'sb_secret_[A-Za-z0-9_-]{8,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}' dist/ >/dev/null 2>&1; then
            echo 'A JWT-shaped or secret-key value was found in dist/. Blocking the build.' >&2
            exit 1
          fi
          echo 'No credential-shaped value in dist/.'
